services:
  blokkli_playground.route_subscriber:
    class: Drupal\blokkli_playground\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }
  Drupal\blokkli_playground\Seed\Seeder:
    autowire: true
  Drupal\blokkli_playground\Access\AnonymousViewerAccessPolicy:
    autowire: true
    tags:
      - { name: access_policy }
  Drupal\blokkli_playground\AltText\PlaceholderAltTextGenerator:
    tags:
      # After a generator of a real service.
      - { name: paragraphs_blokkli.alt_text_generator, priority: -100 }
