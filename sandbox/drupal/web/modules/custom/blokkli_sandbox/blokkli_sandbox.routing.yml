# The control app's logins. The token expires, so the response mustn't be
# cached.
blokkli_sandbox.login:
  path: '/blokkli-sandbox/login/{token}'
  defaults:
    _controller: '\Drupal\blokkli_sandbox\Controller\SandboxLoginController::login'
  requirements:
    # Anyone: the token is the access check.
    _access: 'TRUE'
  options:
    no_cache: TRUE

route_callbacks:
  - '\Drupal\blokkli_sandbox\Routing\SandboxRoutes::routes'
