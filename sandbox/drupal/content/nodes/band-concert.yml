key: band-concert
type: event
title: { en: Annual concert of the town band, de: Jahreskonzert der Musikgesellschaft, fr: Concert annuel de la fanfare }
field_lead:
  en: The Blockingen Town Band plays marches, film music and a new piece, together with the youth band.
  de: Die Musikgesellschaft Blockingen spielt Märsche, Filmmusik und ein neues Stück, zusammen mit der Jugendmusik.
  fr: La Fanfare de Bloquens joue des marches, des musiques de film et un morceau inédit, avec la fanfare des jeunes.
field_hero_image: { media: band-concert }
