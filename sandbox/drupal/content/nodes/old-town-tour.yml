field_lead:
  en: 'From fishing village to watchmaking town: the history of Blockingen in an hour and a half.'
  de: 'Vom Fischerdorf zur Uhrenstadt: die Geschichte Blockingens in anderthalb Stunden.'
  fr: 'Du village de pêcheurs à la cité horlogère : l''histoire de Bloquens en une heure et demie.'
