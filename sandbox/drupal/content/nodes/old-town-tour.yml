field_paragraphs:
  - type: text
    field_text:
      en: '<p>A guide shows you around the old town: the town hall by the lake, the winegrowers'' houses with their steep tiled roofs, and the village square, where markets have been held for centuries and which is now being redesigned. You''ll learn why two languages are spoken in Blockingen and in which living rooms watch parts were once made.</p><p>The tour takes place in all weathers, in German; a tour in French starts at the same time. The route goes over cobblestones and up and down a few steps. Please register: groups are limited to 25 people.</p>'
      de: '<p>Eine Stadtführerin zeigt Ihnen die Altstadt: das Rathaus am See, die Häuser der Weinbauern mit ihren steilen Ziegeldächern und den Dorfplatz, auf dem seit Jahrhunderten Markt gehalten wird und der gerade neu gestaltet wird. Sie erfahren, warum in Blockingen zwei Sprachen gesprochen werden und in welchen Stuben einst Uhrenteile entstanden.</p><p>Die Führung findet bei jedem Wetter statt, auf Deutsch; eine Führung auf Französisch beginnt zur selben Zeit. Der Weg führt über Pflastersteine und einige Treppen. Melden Sie sich an: Eine Gruppe hat höchstens 25 Personen.</p>'
      fr: '<p>Une guide vous fait découvrir la vieille ville : l''hôtel de ville au bord du lac, les maisons des vignerons avec leurs toits de tuiles pentus et la place du village, où se tient le marché depuis des siècles et qui est en cours de réaménagement. Vous apprendrez pourquoi on parle deux langues à Bloquens et dans quels salons on fabriquait autrefois des pièces d''horlogerie.</p><p>La visite a lieu par tous les temps, en allemand ; une visite en français commence à la même heure. Le parcours passe sur des pavés et par quelques escaliers. Inscrivez-vous : un groupe compte 25 personnes au maximum.</p>'
