  - type: text
    field_text:
      en: '<p>The finance committee has reviewed the budget and recommends approving it. The municipal assembly has the final say.</p>'
      de: '<p>Die Finanzkommission hat das Budget geprüft und empfiehlt, es zu genehmigen. Das letzte Wort hat die Gemeindeversammlung.</p>'
      fr: '<p>La commission des finances a examiné le budget et recommande de l''approuver. Le dernier mot revient à l''Assemblée communale.</p>'
