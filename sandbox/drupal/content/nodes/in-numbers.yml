key: in-numbers
type: page
title: { en: Blockingen in numbers, de: Blockingen in Zahlen, fr: Bloquens en chiffres }
field_lead:
  en: 'How many people live here, which languages they speak and what the town spends its money on.'
  de: Wie viele Menschen hier wohnen, welche Sprachen sie sprechen und wofür die Gemeinde ihr Geld ausgibt.
  fr: 'Combien de personnes vivent ici, quelles langues elles parlent et à quoi la commune consacre son argent.'
field_office: { node: municipal-chancery }
field_paragraphs:
  - type: text
    field_text:
      en: '<p>Blockingen is growing slowly but steadily: by a good thousand residents in ten years. The figures come from the residents'' register and the town''s accounts. We update them every spring.</p>'
      de: '<p>Blockingen wächst langsam, aber stetig: in zehn Jahren um gut tausend Einwohnerinnen und Einwohner. Die Zahlen stammen aus dem Einwohnerregister und aus der Rechnung der Gemeinde. Wir aktualisieren sie jedes Jahr im Frühling.</p>'
      fr: '<p>Bloquens grandit lentement, mais sûrement : de plus d''un millier d''habitantes et d''habitants en dix ans. Les chiffres proviennent du registre des habitants et des comptes de la commune. Nous les mettons à jour chaque printemps.</p>'
  - type: title
    field_title: { en: At a glance, de: Auf einen Blick, fr: En bref }
  - type: table
    options: { striped: true }
    field_table:
      en: '<table><thead><tr><th>Indicator</th><th>Value</th></tr></thead><tbody><tr><td>Residents</td><td>15,240</td></tr><tr><td>Households</td><td>6,950</td></tr><tr><td>Jobs</td><td>6,100</td></tr><tr><td>Area</td><td>14.8 km², of which 5.1 km² forest and 0.9 km² vineyards</td></tr><tr><td>Altitude at the lakeshore</td><td>431 m above sea level</td></tr><tr><td>Official languages</td><td>German and French</td></tr></tbody></table>'
      de: '<table><thead><tr><th>Kennzahl</th><th>Wert</th></tr></thead><tbody><tr><td>Einwohnerinnen und Einwohner</td><td>15 240</td></tr><tr><td>Haushalte</td><td>6950</td></tr><tr><td>Arbeitsplätze</td><td>6100</td></tr><tr><td>Fläche</td><td>14,8 km², davon 5,1 km² Wald und 0,9 km² Reben</td></tr><tr><td>Höhe am Seeufer</td><td>431 m ü. M.</td></tr><tr><td>Amtssprachen</td><td>Deutsch und Französisch</td></tr></tbody></table>'
      fr: '<table><thead><tr><th>Indicateur</th><th>Valeur</th></tr></thead><tbody><tr><td>Habitantes et habitants</td><td>15 240</td></tr><tr><td>Ménages</td><td>6950</td></tr><tr><td>Emplois</td><td>6100</td></tr><tr><td>Superficie</td><td>14,8 km², dont 5,1 km² de forêt et 0,9 km² de vignes</td></tr><tr><td>Altitude au bord du lac</td><td>431 m</td></tr><tr><td>Langues officielles</td><td>Allemand et français</td></tr></tbody></table>'
  - type: title
    field_title: { en: Population, de: Bevölkerung, fr: Population }
  - type: chart
    options:
      data:
        type: bar
        categories: []
        series: []
        categoryColors: []
        numberFormat: { locale: de-CH }
        typeOptions: { stacked: true }
        dataSource: { id: population, label: 'Wohnbevölkerung nach Nationalität, 2016–2025' }
        translations:
          en:
            title: Population by nationality
            valueAxisTitle: Residents
            footnotes: [Permanent residents at the end of the year.]
          de:
            title: Wohnbevölkerung nach Nationalität
            valueAxisTitle: Einwohnerinnen und Einwohner
            footnotes: [Ständige Wohnbevölkerung am Jahresende.]
          fr:
            title: Population résidante par nationalité
            valueAxisTitle: Habitantes et habitants
            footnotes: ['Population résidante permanente en fin d''année.']
  - type: title
    field_title: { en: Languages, de: Sprachen, fr: Langues }
  - type: text
    field_text:
      en: '<p>Just under six in ten residents mainly speak German, and a third speak French. The town conducts its business in both languages, and every resident chooses their own language of correspondence.</p>'
      de: '<p>Knapp sechs von zehn Einwohnerinnen und Einwohnern sprechen hauptsächlich Deutsch, ein Drittel Französisch. Die Gemeinde führt ihre Geschäfte in beiden Sprachen, und jede Einwohnerin und jeder Einwohner wählt die eigene Korrespondenzsprache.</p>'
      fr: '<p>Un peu moins de six habitantes et habitants sur dix parlent principalement l''allemand, un tiers le français. La commune mène ses affaires dans les deux langues, et chaque habitante et chaque habitant choisit sa propre langue de correspondance.</p>'
  - type: chart
    options:
      data:
        type: pie
        categories: []
        series: []
        categoryColors: []
        numberFormat: { locale: de-CH, suffix: ' %' }
        dataSource: { id: languages, label: Hauptsprache der Bevölkerung }
        translations:
          en:
            title: Main language of the population
            footnotes: [As a percentage of the permanent resident population.]
          de:
            title: Hauptsprache der Bevölkerung
            footnotes: [In Prozent der ständigen Wohnbevölkerung.]
          fr:
            title: Langue principale de la population
            footnotes: [En pourcentage de la population résidante permanente.]
  - type: title
    field_title: { en: Finances, de: Finanzen, fr: Finances }
  - type: text
    field_text:
      en: '<p>The town spends around CHF 68 million every year. Schools and social security cost the most: together they account for more than half.</p>'
      de: '<p>Die Gemeinde gibt jedes Jahr rund 68 Millionen Franken aus. Am meisten kosten die Schulen und die soziale Sicherheit: Zusammen machen sie mehr als die Hälfte aus.</p>'
      fr: '<p>La commune dépense chaque année environ 68 millions de francs. Les écoles et la sécurité sociale sont les postes les plus coûteux : ensemble, ils représentent plus de la moitié des dépenses.</p>'
  - type: chart
    options:
      data:
        type: pie
        categories: []
        series: []
        categoryColors: []
        numberFormat: { locale: de-CH }
