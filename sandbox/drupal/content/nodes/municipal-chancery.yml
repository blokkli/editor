field_paragraphs:
  - type: text
    field_text:
      en: '<p>The municipal chancery is your first point of contact at the town hall. It answers general questions and tells you which office deals with your request. Led by the town clerk, Claire Rossel, it runs the municipal council''s secretariat, prepares the municipal assembly, organises votes and elections and publishes the official publications.</p><p>At the counter, you can get printed copies of the budget and the accounts, and this is also where you''ll find the town''s lost property office. Report anything you''ve lost by phone or email; we keep lost property for a year.</p>'
      de: '<p>Die Gemeindekanzlei ist die erste Anlaufstelle im Rathaus. Sie beantwortet allgemeine Fragen und sagt Ihnen, welches Amt für Ihr Anliegen zuständig ist. Unter der Leitung von Gemeindeschreiberin Claire Rossel führt sie das Sekretariat des Gemeinderats, bereitet die Gemeindeversammlung vor, organisiert die Abstimmungen und Wahlen und veröffentlicht die amtlichen Publikationen.</p><p>Am Schalter erhalten Sie das Budget und die Rechnung gedruckt, und hier ist auch das Fundbüro der Gemeinde. Was Sie verloren haben, melden Sie am Telefon oder per E-Mail; Fundsachen bewahren wir ein Jahr lang auf.</p>'
      fr: '<p>La Chancellerie communale est le premier point de contact à l''hôtel de ville. Elle répond aux questions générales et vous indique quel service est compétent pour votre demande. Sous la direction de la secrétaire communale, Claire Rossel, elle assure le secrétariat du Conseil communal, prépare l''Assemblée communale, organise les votations et les élections et fait paraître les publications officielles.</p><p>Au guichet, vous pouvez obtenir le budget et les comptes imprimés, et c''est aussi ici que se trouve le bureau des objets trouvés de la commune. Signalez ce que vous avez perdu par téléphone ou par e-mail ; nous conservons les objets trouvés pendant un an.</p>'
