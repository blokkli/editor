fragment nodePage on NodePage {
  uuid
  title
  lead: fieldLead
  office: fieldOffice {
    ...officeContact
  }
  changedDate: changedRawField {
    first {
      day: formatted(drupalDateFormat: DAY)
    }
  }
  blokkliProps {
    ...blokkliProps
  }
  paragraphs: fieldParagraphs {
    ...paragraphsFieldItem
    props {
      ...paragraph
    }
  }
  related: fieldRelated {
    ...paragraphsFieldItem
    props {
      ...paragraphTeaser
    }
  }
  aside: fieldAside {
    ...paragraphsFieldItem
    props {
      ...paragraph
    }
  }
}
