fragment nodePublication on NodePublication {
  __typename
  uuid
  title
  lead: fieldLead
  publicationType: fieldPublicationType
  period: fieldPeriod {
    startDay: startDate(drupalDateFormat: DAY)
    endDay: endDate(drupalDateFormat: DAY)
  }
  blokkliProps {
    ...blokkliProps
  }
  paragraphs: fieldParagraphs {
    ...paragraphsFieldItem
    props {
      ...paragraph
    }
  }
}
