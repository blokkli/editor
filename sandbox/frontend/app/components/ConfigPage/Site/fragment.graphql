fragment configPageSite on TranslatableConfigPagesSite {
  uuid
  label
  url {
    path
  }
  siteName: fieldSiteName
  serviceLinks: fieldServiceLinks {
    ...paragraphsFieldItem
    props {
      ...paragraphLink
    }
  }
  quickLinks: fieldQuickLinks {
    ...paragraphsFieldItem
    props {
      ...paragraphLink
    }
  }
  blokkliProps {
    ...blokkliProps
  }
  notice: fieldNotice {
    ...paragraphsFieldItem
    props {
      ...paragraph
    }
  }
}
