# Every paragraph type, nested ones included: the editor loads each field's
# blocks with this fragment, e.g. a step on its own, outside its steps.
fragment paragraph on Paragraph {
  ...paragraphLeaf
  ...paragraphGallery
  ...paragraphSection
  ...paragraphAccordion
  ...paragraphColumns
  ...paragraphFromLibrary
  ...paragraphBlokkliFragment
  ...paragraphStep
}
