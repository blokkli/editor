fragment paragraphLink on ParagraphLink {
  title: fieldTitle
  link: fieldLink {
    uri {
      path
      ... on EntityUrl {
        entity {
          __typename
          label
          ... on Media {
            mediaFileUrl {
              path
            }
          }
          ... on MediaDocument {
            file: fieldMediaDocument {
              entity {
                filesize
              }
            }
          }
        }
      }
    }
  }
}
