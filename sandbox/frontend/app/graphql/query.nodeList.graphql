# An automatic list of nodes: the teaser list and the overview pages (filter
# and sort from helpers/nodeList.ts), and an office's pages.
query nodeList(
  $filter: EntityQueryFilterInput!
  $sort: [EntityQuerySortInput!]
  $limit: Int!
  $offset: Int = 0
) {
  entityQuery(
    entityType: NODE
    limit: $limit
    offset: $offset
    filter: $filter
    sort: $sort
  ) {
    total
    items {
      ...nodeTeaser
    }
  }
}
