query route($path: String!) {
  route(path: $path) {
    __typename
    ... on InternalUrl {
      languageSwitchLinks {
        ...languageSwitchLink
      }
      # From the main menu (menu_breadcrumb), ending with the current page.
      breadcrumb {
        ...breadcrumb
      }
    }
    ... on EntityUrl {
      entity {
        __typename
        # The front page is node 1 (system.site.page.front).
        id
        # A config page's own route shows its label: the layout renders the
        # config page itself, where it's edited.
        label
        ...nodePage
        ...nodeEditorial
        ...nodeNews
        ...nodeEvent
        ...nodeOffice
        ...nodePublication
      }
    }
  }
}
