# The page "Field access", at /en/field-access (features/field-access). The
# test module blokkli_playground_test locks its aside, the right column and the
# widget's title and media for Tim Fischer.
key: field-access
type: page
title: Field access
field_aside:
  - type: title
    key: field-access-aside-title
    field_title: A title in the aside
  - type: link_list
    key: field-access-aside-links
    field_paragraphs:
      - type: link
        key: field-access-aside-link
        field_title: A link in the aside
        field_link: https://www.example.com
field_paragraphs:
  - type: columns
    key: field-access-columns
    field_left:
      - type: title
        key: field-access-left
        field_title: A title on the left
    field_right:
      - type: text
        key: field-access-right
        field_text: '<p>A text on the right.</p>'
  - type: widget
    key: field-access-widget
    field_title: A locked title
    field_lead: An open lead.
    field_media_items:
      - { media: guide }
