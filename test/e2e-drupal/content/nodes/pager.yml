# Two galleries as sliders, at /en/pager. While editing, a field in proxy mode
# renders as a pager (features/pager): a band of pages and the image it shows.
# The second gallery has more images than fit in its band.
key: pager
type: page
title: Pager
field_paragraphs:
  - type: text
    key: pager-intro
    field_text: '<p>Before the galleries.</p>'
  - type: gallery
    key: pager-gallery
    options: { display: slider }
    field_paragraphs:
      - type: image
        key: pager-image-1
        field_media: { media: lake }
      - type: image
        key: pager-image-2
        field_media: { media: hills }
      - type: image
        key: pager-image-3
        field_media: { media: lake }
  - type: text
    key: pager-between
    field_text: '<p>Between the galleries.</p>'
