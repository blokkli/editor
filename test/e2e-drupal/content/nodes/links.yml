# A page whose texts are rendered differently from how they're stored, at
# /en/links. basic_html's filter renders each external link with
# target="_blank" and a visually hidden "(opens in a new tab)" after it; titles
# and leads are rendered with "ss" for "ß" (Swiss spelling). The tests that
# change a text have their own.
key: links
type: page
title: Links
field_lead: Alpha Straße Beta
field_paragraphs:
  - type: title
    key: links-title
    field_title: Alpha Fußweg
  - type: text
    key: links-read
    field_text:
      '<p>Alpha and <a href="https://www.example.com">Omega</a></p><p>Beta and
      Gamma</p>'
  - type: text
    key: links-patch
    field_text:
      '<p>Alpha and <a href="https://www.example.com">Omega</a></p><p>Beta and
      Gamma</p>'
  - type: text
    key: links-diff
    field_text:
      '<p>Alpha and <a href="https://www.example.com">Omega</a></p><p>Beta and
      Gamma</p>'
  - type: text
    key: links-compound
    field_text:
      '<p>Alpha and <a href="https://www.example.com">Omega</a></p><p>Beta and
      Gamma</p>'
