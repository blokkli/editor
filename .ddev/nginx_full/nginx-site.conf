# nginx for the blökkli ddev project. Maintained here: this file has no
# "ddev-generated" line, so ddev leaves it alone.
#
# One public server routes by path: the Drupal paths listed below go to an
# internal Drupal server (PHP-FPM, :8888), everything else goes to the Nuxt
# server (the "nuxt" daemon, :3000). Adapted from the blökkli starterkit's
# nginx-site-local.conf.template. A second public server sends the control
# app's host to its server (the "control" daemon, :3001).
#
# The same file serves locally and hosted. The domain is ddev's project_tld:
# ddev.site locally, the hosted domain on the server. The hosts have the same
# shape in both: blokkli.<domain> (the default site), <id>.blokkli.<domain> (a
# sandbox) and blokkli-control.<domain> (the control app). The ddev router only
# passes on the project's own hostnames, and sets X-Forwarded-Host itself.
#
# After changing the routes, run `ddev restart` and `ddev check-routes`.

# The host the browser asked for. Behind the ddev router (Traefik) that's
# X-Forwarded-Host. Nuxt's server-side requests to http://127.0.0.1 must send
# the original host as X-Forwarded-Host, so that Drupal serves the right site
# (sandboxes are chosen by host).
map $http_x_forwarded_host $blokkli_host {
  default $http_x_forwarded_host;
  ''      $host;
}

# The router sends every request to port 80, so the scheme comes from
# X-Forwarded-Proto. WebSocket requests arrive with "ws"/"wss".
map $http_x_forwarded_proto $blokkli_forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

map $blokkli_forwarded_proto $blokkli_proto {
  ~*^(?:https|wss)(?:,|$) https;
  ~*^(?:http|ws)(?:,|$)   http;
  default                 $scheme;
}

map $http_upgrade $blokkli_connection {
  default upgrade;
  ''      close;
}

# Whether this is the local site (ddev.site) or the hosted one.
map $blokkli_host $blokkli_local {
  "~\.ddev\.site(?::\d+)?$" 1;
  default                    0;
}

# The sandbox the host names: its id (the pattern of settings.php), "-" for a
# subdomain that can't be one, or "" for the default site.
map $blokkli_host $blokkli_sandbox {
  "~^([a-z0-9]{2,32})\.blokkli\.[^:]+(?::\d+)?$" $1;
  "~\.blokkli\.[^:]+(?::\d+)?$"                   -;
  default                                          "";
}

# The control app's URL, on the same domain.
map $blokkli_host $blokkli_control_url {
  "~(?:^|\.)blokkli\.(?<blokkli_domain>[^:]+?)(?::\d+)?$" https://blokkli-control.$blokkli_domain;
  default                                                  "";
}

# Hosted, the default site is only what the bakes make the templates of: its
# host leads to the control app. Locally it's the dev site.
map "$blokkli_local:$blokkli_host" $blokkli_default_hidden {
  "~^0:blokkli\.[^:]+(?::\d+)?$" 1;
  default                         0;
}

# A sandbox's files only on its own host: public, but not across sandboxes.
# The default site ("") serves none of them. $uri is decoded and normalised.
map "$blokkli_sandbox:$uri" $blokkli_files_denied {
  "~^([a-z0-9]+):/sites/default/files/sandboxes/\1/" 0;
  "~:/sites/default/files/sandboxes/"                1;
  default                                            0;
}

# Drupal's GraphQL endpoint is for Nuxt's server, which calls it from inside
# the container: the browser asks nuxt-graphql-middleware, which sends only the
# app's operations. From outside, through the router, only the local dev site
# ("1" and "") answers, for debugging; everything else gets 403.
# $realip_remote_addr is the connection's address, even if a real-IP setting
# changes $remote_addr.
map "$blokkli_local$blokkli_sandbox:$realip_remote_addr" $blokkli_graphql_denied {
  "~^1:"            0;
  "~:127\.0\.0\.1$" 0;
  default           1;
}

# PHP-FPM's status page (/etc/nginx/monitoring.conf) only from inside the
# container, for ddev's healthcheck: it lists the workers' last requests, query
# strings included.
map "$uri:$realip_remote_addr" $blokkli_status_denied {
  "~^/phpstatus:127\.0\.0\.1$" 0;
  "~^/phpstatus:"              1;
  default                      0;
}

# A mutation reaches nuxt-graphql-middleware only as JSON. The middleware reads
# any body (text/plain, forms) and sends the mutation to Drupal with the
# browser's session cookie. The sandboxes, the control app and the default site
# are same-site to each other, so SameSite=Lax doesn't keep a sibling's page
# from posting one. From another origin, a JSON POST needs a CORS preflight,
# which nothing here answers. Drupal's own endpoint has the same rule.
map $content_type $blokkli_json {
  "~*^application/json\s*(?:;|$)" 1;
  default                         0;
}

map "$blokkli_json$uri" $blokkli_mutation_refused {
  "~*^0/api/graphql_middleware/mutation/" 1;
  default                                 0;
}

# The Content-Security-Policy of the responses that come without one, sent by
# headers.inc: the control app's, nginx's own pages and the files it serves.
# The frontend's comes from nuxt-security (sandbox/frontend/nuxt.config.ts),
# Drupal's from the csp module (sandbox/drupal/config/sync/csp.settings.yml).
# Pasted images are data: URLs, downloads blob: URLs. 'self' covers the
# same-origin WebSockets. The control app's claim page loads Cloudflare's
# Turnstile.
map $upstream_http_content_security_policy $blokkli_csp {
  ""      $blokkli_csp_fallback;
  default "";
}

map $blokkli_host $blokkli_csp_fallback {
  "~^blokkli-control\." "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'";
  default               "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'";
}

# Internal Drupal server. Only the public server below talks to it.
server {
  listen 127.0.0.1:8888;
  server_name localhost;

  root /var/www/html/sandbox/drupal/web;
  index index.php;

  absolute_redirect off;
  port_in_redirect off;
  server_tokens off;
  sendfile off;
  client_max_body_size 100M;

  error_log /dev/stdout info;
  access_log /var/log/nginx/access.log;

  location / {
    try_files $uri /index.php?$query_string;
  }

  location @rewrite {
    rewrite ^ /index.php;
  }

  location = /favicon.ico {
    access_log off;
    log_not_found off;
  }

  # PHP never runs from the files directories. Before the other locations of
  # files: the first matching regex wins.
  location ~ ^/sites/[^/]+/files/.*\.php$ {
    deny all;
  }

  # Image styles are generated by Drupal on first request.
  location ~ ^/sites/.*/files/styles/ {
    try_files $uri @rewrite;
  }

  location ~ ^/sites/.*/private/ {
    return 403;
  }

  location ^~ /system/files/ {
    log_not_found off;
    access_log off;
    try_files $uri @rewrite;
  }

  # PHP runs only for Drupal's front controllers. update.php has pages after it.
  location ~ ^/(?:index\.php|update\.php(?:/.*)?|core/(?:authorize|install|rebuild)\.php)$ {
    fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
    fastcgi_pass unix:/run/php/php-fpm.sock;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_intercept_errors off;
    # Should match max_execution_time in php.ini.
    fastcgi_read_timeout 10m;
    fastcgi_param SERVER_NAME $host;
    fastcgi_param HTTPS $fcgi_https;
    # Lets Drupal's BigPipe turn off buffering in the public server's proxy.
    fastcgi_pass_header "X-Accel-Buffering";
  }

  # Every other PHP file, e.g. settings.php: running one directly only prints
  # its warnings.
  location ~ \.php(?:/|$) {
    return 404;
  }

  # Hidden files, except /.well-known/.
  location ~* /\.(?!well-known\/) {
    deny all;
  }

  # Drupal's source and metadata files, as Drupal's nginx recipe denies them,
  # and backups and editors' leftovers.
  location ~* (?:\.(?:bak|conf|dist|engine|fla|in[ci]|install|log|make|module|orig|po|profile|psd|save|sh|sql|sw[op]|theme|twig|xtmpl|ya?ml)|~|/(?:composer\.(?:json|lock)|package\.json|yarn\.lock|web\.config))$ {
    deny all;
  }

  location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|webp|htc|avif)$ {
    try_files $uri @rewrite;
    expires max;
    log_not_found off;
  }

  location ~* \.(?:js|css)$ {
    try_files $uri @rewrite;
    expires -1;
    log_not_found off;
  }
}

# Public server: every hostname but the control app's (the site and the
# sandboxes).
server {
  listen 80 default_server;
  listen 443 ssl default_server;

  ssl_certificate /etc/ssl/certs/master.crt;
  ssl_certificate_key /etc/ssl/certs/master.key;

  # /phpstatus and /healthcheck: ddev's container healthcheck needs them. The
  # status page only from inside the container ($blokkli_status_denied).
  include /etc/nginx/monitoring.conf;

  absolute_redirect off;
  port_in_redirect off;
  server_tokens off;
  client_max_body_size 100M;
  large_client_header_buffers 4 32k;

  error_log /dev/stdout info;
  access_log /var/log/nginx/access.log;

  include /mnt/ddev_config/nginx_full/proxy.inc;

  # Which upstream handled the request. Used by `ddev check-routes`.
  set $blokkli_upstream nginx;
  add_header X-Blokkli-Upstream $blokkli_upstream always;
  include /mnt/ddev_config/nginx_full/headers.inc;

  if ($blokkli_default_hidden) {
    return 302 $blokkli_control_url;
  }

  # A sandbox without a database doesn't exist, or has expired: a static page
  # for every path. The default site ("") passes. 410, so that no other error
  # shows the page; a named location, so that the check doesn't run again for
  # it (a redirect to a URI would). The page links to the claim page, at
  # $blokkli_control_url (SSI).
  set $blokkli_sandbox_missing $blokkli_sandbox;
  if (-f /var/www/html/sandbox/drupal/sandboxes/$blokkli_sandbox/db.sqlite) {
    set $blokkli_sandbox_missing "";
  }
  if ($blokkli_sandbox_missing) {
    return 410;
  }
  error_page 410 @sandbox_unknown;

  if ($blokkli_files_denied) {
    return 404;
  }

  if ($blokkli_mutation_refused) {
    return 415;
  }

  if ($blokkli_status_denied) {
    return 404;
  }

  location @sandbox_unknown {
    root /mnt/ddev_config/nginx_full;
    ssi on;
    try_files /sandbox-unknown.html =500;
    # The same id can be created later (E2E tests recreate theirs).
    add_header Cache-Control "no-store" always;
    add_header X-Blokkli-Upstream sandbox-unknown always;
    include /mnt/ddev_config/nginx_full/headers.inc;
  }

  # Shown when the upstream isn't running.
  location = /502-nuxt.html {
    internal;
    root /mnt/ddev_config/nginx_full;
  }

  location = /502-drupal.html {
    internal;
    root /mnt/ddev_config/nginx_full;
  }

  # Drupal's GraphQL endpoint, for the requests $blokkli_graphql_denied lets
  # through. Ahead of the other Drupal paths: the first matching regex wins.
  location ~ ^(?:/(?:en|de|fr))?/graphql(?:/|$) {
    if ($blokkli_graphql_denied) {
      return 403;
    }
    set $blokkli_upstream drupal;
    error_page 502 /502-drupal.html;
    proxy_pass http://127.0.0.1:8888;
  }

  # Drupal paths, optionally with a language prefix. Anchored at a path
  # segment, so e.g. /blockchain or /users stay with Nuxt.
  location ~ ^(?:/(?:en|de|fr))?/(?:admin|batch|big_pipe|block|block-category|blokkli-sandbox|ckeditor5|comment|comments|contextual|core|cron|editor|entity_reference_autocomplete|file|filter|history|layout_builder|libraries|masquerade|media|media-library|modules|paragraphs_blokkli|paragraphs_blokkli_graphql|profiles|scheduler|session|sites|system|themes|token|toolbar|unmasquerade|user|views)(?:/|$) {
    set $blokkli_upstream drupal;
    error_page 502 /502-drupal.html;
    proxy_pass http://127.0.0.1:8888;
  }

  # Entity forms. The canonical pages (/node/1) are rendered by Nuxt.
  location ~ ^(?:/(?:en|de|fr))?/(?:node|taxonomy/term)/(?:add|preview|\d+/(?:edit|delete|revisions|translations|usage))(?:/|$) {
    set $blokkli_upstream drupal;
    error_page 502 /502-drupal.html;
    proxy_pass http://127.0.0.1:8888;
  }

  # Drupal's front controllers; core's (core/install.php) come with /core. Only
  # /index.php itself: Drupal routes the path after it (/index.php/graphql)
  # past the locations above. update.php has pages after it.
  location ~ ^/(?:\.well-known/|index\.php$|update\.php(?:/|$)) {
    set $blokkli_upstream drupal;
    error_page 502 /502-drupal.html;
    proxy_pass http://127.0.0.1:8888;
  }

  # Vite assets and the HMR WebSocket.
  location ^~ /_nuxt/ {
    set $blokkli_upstream nuxt;
    error_page 502 /502-nuxt.html;
    proxy_read_timeout 1h;
    proxy_pass http://127.0.0.1:3000;
  }

  # The blökkli agent's WebSocket.
  location ^~ /api/blokkli/agent {
    set $blokkli_upstream nuxt;
    error_page 502 /502-nuxt.html;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_pass http://127.0.0.1:3000;
  }

  location / {
    set $blokkli_upstream nuxt;
    error_page 502 /502-nuxt.html;
    proxy_pass http://127.0.0.1:3000;
  }
}

# The control app (sandbox/control): the claim page and the admin pages, for
# every path.
server {
  listen 80;
  listen 443 ssl;
  server_name "~^blokkli-control\.";

  ssl_certificate /etc/ssl/certs/master.crt;
  ssl_certificate_key /etc/ssl/certs/master.key;

  absolute_redirect off;
  port_in_redirect off;
  server_tokens off;

  error_log /dev/stdout info;
  access_log /var/log/nginx/access.log;

  include /mnt/ddev_config/nginx_full/proxy.inc;

  add_header X-Blokkli-Upstream control always;
  include /mnt/ddev_config/nginx_full/headers.inc;

  location = /502-control.html {
    internal;
    root /mnt/ddev_config/nginx_full;
  }

  # Vite assets and the HMR WebSocket.
  location ^~ /_nuxt/ {
    error_page 502 /502-control.html;
    proxy_read_timeout 1h;
    proxy_pass http://127.0.0.1:3001;
  }

  # Access links: the path is the credential, so it stays out of the log.
  location ^~ /access/ {
    access_log off;
    error_page 502 /502-control.html;
    proxy_pass http://127.0.0.1:3001;
  }

  location / {
    error_page 502 /502-control.html;
    proxy_pass http://127.0.0.1:3001;
  }
}
