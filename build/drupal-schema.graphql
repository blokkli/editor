  current language.
  """
  menuByName(
    "The name of the menu."
    name: MenuName!
  ): Menu

  """
  List conversations of the current user, ordered by last changed date
  (newest first). When the `host` argument is provided, results are filtered
  to that host entity; when omitted, all of the current user's conversations
  are returned. Requires the "use paragraphs blokkli agent" permission.
  """
  paragraphsBlokkliAgentConversations(
    "Optional host entity filter."
    host: ParagraphsBlokkliHostEntityInput

    "Additional user-configurable filters. None are currently supported and any provided values are ignored."
    filters: [ParagraphsBlokkliUserConfigInput]

    "Zero-indexed page number for pagination."
    page: Int
