"""
Interface for entities that are revisionable.
This corresponds to the core RevisionableInterface but is only implemeted by entity types where revisions are enabled.
"""
interface EntityRevisionable implements Entity {
  """Check entity access for the given operation, defaults to view."""
  accessCheck(operation: String): Boolean!

  """The bundle ID of the entity."""
  entityBundle: String!

  """
  The revision identifier of the entity, or NULL if the entity does not have a revision identifier.
  """
  entityRevisionId: String

  """The entity type ID."""
  entityTypeId: String!
  id: String

  """Checks if this entity is the latest revision."""
  isLatestRevision: Boolean

  """Determines whether the entity is new."""
  isNew: Boolean!

  """The label of this entity."""
  label: String

  """The langcode of this entity."""
  langcode: String

  """The unique UUID."""
  uuid: String!

  """TRUE if the entity object was a revision, FALSE otherwise."""
  wasDefaultRevision: Boolean
}

"""An entity that is translatable."""
interface EntityTranslatable implements Entity {
  """Check entity access for the given operation, defaults to view."""
  accessCheck(operation: String): Boolean!

  """The bundle ID of the entity."""
  entityBundle: String!

  """The entity type ID."""
  entityTypeId: String!
  id: String

  """Determines whether the entity is new."""
  isNew: Boolean!

  """The label of this entity."""
  label: String

  """The langcode of this entity."""
  langcode: String

  """Get a specific translation."""
  translation(
    """
    Return entity in current language if translation language does not exist.
    """
    fallback: Boolean
    langcode: Langcode!
  ): EntityTranslatable

  """Get all translations."""
  translations: [EntityTranslatable]

  """The unique UUID."""
  uuid: String!
}

