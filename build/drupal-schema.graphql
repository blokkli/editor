  Whether to force the output to be an absolute link (beginning with http:).
  Useful for links that will be displayed outside the site, such as in an RSS
  """
  absolute: Boolean

  """
  A fragment identifier (named anchor) to append to the URL. Do not include the leading '#' character.
  """
  fragment: String

  """Force generating the URL in the given langcode."""
  language: Langcode
}

"""User"""
type User implements Entity & EntityLinkable {
  """{value} {field: access} The time that the user last accessed the site."""
  access: String

  """Check entity access for the given operation, defaults to view."""
  accessCheck(operation: String): Boolean!

  """{field: access} The time that the user last accessed the site."""
  accessRawField: FieldItemListTimestamp

  """
  {value} {field: changed} Der Zeitpunkt, zu dem der Benutzer zuletzt bearbeitet wurde.
  """
  changed: String

  """
  {field: changed} Der Zeitpunkt, zu dem der Benutzer zuletzt bearbeitet wurde.
  """
  changedRawField: FieldItemListChanged

  """{value} {field: created} The time that the user was created."""
  created: String

  """{field: created} The time that the user was created."""
  createdRawField: FieldItemListCreated

  """The bundle ID of the entity."""
  entityBundle: String!

  """The entity type ID."""
  entityTypeId: String!
  hasPermission(permission: String!): Boolean!

  """Check if the user has the given role."""
  hasRole(role: String!): Boolean!
  id: String

  """Determines whether the entity is new."""
  isNew: Boolean!

  """The label of this entity."""
  label: String

  """The langcode of this entity."""
  langcode: String

  """{value} {field: mail} The email of this user."""
  mail: String

  """{field: mail} The email of this user."""
  mailRawField: FieldItemListEmail

  """{value} {field: name} The name of this user."""
  name: String

  """{field: name} The name of this user."""
  nameRawField: FieldItemListString

  """Contains a list of all roles of this user."""
  roleIds: [String]

  """{value} {field: status} Whether the user is active or blocked."""
  status: Boolean

  """{field: status} Whether the user is active or blocked."""
  statusRawField: FieldItemListBoolean

  """{value} {field: uid} The user ID."""
  uid: Int

  """{field: uid} The user ID."""
  uidRawField: FieldItemListInteger

  """Get the URL, defaults to canonical."""
  url(options: UrlOptions, rel: String): Url

  """The unique UUID."""
  uuid: String!
}

"""The response for the userLogin mutation."""
type UserLoginResponse {
  """The CSRF token to be used for logging out."""
  csrfToken: String

  """Error message."""
  error: String

  """The token to use for logging out."""
  logoutToken: String

  """The user name if login was successful."""
  name: String

  """Login was successful."""
  success: Boolean

  """The user ID if login was successful."""
  uid: String
}

"""The response for the userLogout mutation."""
type UserLogoutResponse {
  """Error message if logout was not successful."""
  error: String

  """Logout was successful."""
  success: Boolean
}

"""The response for the userPasswordChange mutation."""
type UserPasswordChangeResponse {
  """Error message if password change was not successful."""
  error: String

  """Password change was successful."""
  success: Boolean
}

"""The response for the userPasswordResetLogin mutation."""
type UserPasswordResetLoginResponse {
  """Error message if password reset was not successful."""
  error: String

  """Password reset was successful."""
  success: Boolean

  """The password reset token for the edit form."""
  token: String

  """The logged in user entity."""
  user: User
}

"""The response for the userPasswordReset mutation."""
type UserPasswordResetResponse {
  """Error message if password reset was not successful."""
  error: String

  """Password reset was successful."""
  success: Boolean
}