"A persisted agent conversation belonging to a user and host entity."
type ParagraphsBlokkliAgentConversation {
  "The UUID of the conversation entity."
  uuid: String!

  "The user-defined title of the conversation."
  title: String!

  """
  The agent server's HMAC of the messages and tools in dataServer. The agent
  server checks it when the conversation is restored; Drupal stores it as
  sent.
  """
  hash: String!

  """
  JSON-encoded state of the conversation as the editor shows it. Stored as the
  user's editor sent it, and not covered by the hash.
  """
  dataUser: String!

  """
  JSON-encoded state of the conversation as the agent server keeps it: the
  messages and the tools it loaded. Covered by the hash.
  """
  dataServer: String!

  "The UUID of the host entity this conversation belongs to."
  hostEntityUuid: String!

  "The entity type ID of the host entity (e.g. \"node\")."
  hostEntityType: String!

  "ISO 8601 timestamp of when the conversation was created."
  created: String!

  "ISO 8601 timestamp of when the conversation was last changed."
  changed: String!

  "Feedback items submitted for this conversation."
  feedback: [ParagraphsBlokkliAgentFeedback!]!

  """
  The user who originally created the conversation.
  
  Nullable: the resolver loads the owner account, which returns NULL when
  the account has since been deleted.
  """
  author: ParagraphsBlokkliUser

  """
  Information about the host entity this conversation belongs to.
  Provided separately from the host type/uuid scalar fields so admin
  views can show a human-readable label and link to the host.
  """
  host: ParagraphsBlokkliHostEntity
}

