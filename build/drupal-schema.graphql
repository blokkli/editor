  access is denied. Requires the "use paragraphs blokkli agent" permission.
  """
  paragraphsBlokkliAgentConversation(
    "The UUID of the conversation to load."
    uuid: String!
  ): ParagraphsBlokkliAgentConversation

  """
  Returns the most recently changed conversation of the current user for the
  given host entity, provided it was changed within the last 24 hours.
  Returns NULL if nothing matches or access is denied. Requires the
  "use paragraphs blokkli agent" permission.
  """
  paragraphsBlokkliAgentConversationLatest(
    "The host entity to look up the latest conversation for."
    host: ParagraphsBlokkliHostEntityInput!
  ): ParagraphsBlokkliAgentConversation

  """
  List feedback items across all conversations the current user can manage,
