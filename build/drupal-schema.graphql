"""
Defines a hierarchical facet configuration for level-based hierarchies.

Level fields are auto-discovered based on naming convention:
- Given ID "ARTICLES_TYPESENSE_BOOKS", looks for fields:
  books_lvl1, books_lvl2, books_lvl3, etc.

The AlgoliaHierarchy processor indexes data in this format:
- books_lvl1: ["Products"]
- books_lvl2: ["Products > Fruits"]
- books_lvl3: ["Products > Fruits > Citrus"]

The hierarchy is exposed as a SINGLE facet with a nested tree structure.
Selection is done using the full path value (e.g., "Products > Fruits").

Field requirements:
- Use data type "Typesense: Hierarchy Level" for each level field
- Fields must support multiple values (for items with multiple categories)
"""
input TypesenseHierarchicalFacetInput {
  """
  The facet ID for this hierarchy (e.g., ARTICLES_TYPESENSE_BOOKS).
  Level fields are auto-discovered: books_lvl1, books_lvl2, etc.
  Use this same ID in selectedFacets to filter by hierarchy values.
  """
  id: TypesenseFacetId!

  """Separator used in the indexed values (default: ' > ')."""
  separator: String

  """How to sort facet terms at each level (default: NAME)."""
  sortBy: TypesenseHierarchicalFacetSortBy

  """
  Strip weight prefix from labels for display.
  When true, expects format "000040 Label" (6-digit weight + space + label).
  Sorting happens BEFORE stripping, so NAME sort respects weights.
  """
  stripWeightPrefix: Boolean
}

"""Sort order for hierarchical facet terms."""
enum TypesenseHierarchicalFacetSortBy {
  """Sort by count descending (most results first)."""
  COUNT

  """
  Sort alphabetically by name (A-Z).
  When weight prefixes are used (e.g., "000040 Label"), alphabetical
  sorting will effectively sort by weight.
  """
  NAME
}

