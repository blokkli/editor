# Deploys the hosted sandbox (dev-sandbox.blokk.li) on every push to dev.
#
# The key in SANDBOX_SSH_KEY may only run `ddev deploy` on the server: its
# entry in liip@starterkit.blokk.li's authorized_keys has a forced command
# (under flock, so that deploys never overlap). The server pulls the branch
# itself. A deploy deletes every sandbox (plans/drupal-setup/12a-server-setup.md).
name: Deploy sandbox

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SANDBOX_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SANDBOX_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: ddev deploy
        run: ssh -o BatchMode=yes liip@starterkit.blokk.li
