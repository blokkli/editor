# A date range formatted by Drupal in the page's language (the date format
# "day" and month names are translated). `start` is for machines, e.g.
# <time datetime>. `badgeDay` and `badgeMonth` are for the date badge.
fragment dateRange on FieldItemTypeDaterange {
  start: startDate(format: "c")
  startDay: startDate(drupalDateFormat: DAY)
  badgeDay: startDate(format: "j")
  badgeMonth: startDate(format: "M")
  startTime: startDate(format: "H:i")
  endDay: endDate(drupalDateFormat: DAY)
  endTime: endDate(format: "H:i")
}
