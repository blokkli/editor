query route($path: String!) {
  route(path: $path) {
    __typename
    ... on InternalUrl {
      languageSwitchLinks {
        ...languageSwitchLink
      }
      # From the main menu (menu_breadcrumb), ending with the current page.
      breadcrumb {
        ...breadcrumb
      }
    }
    ... on EntityUrl {
      entity {
        __typename
        # The front page is node 1 (system.site.page.front).
        id
        ...nodePage
        ...nodeEditorial
        ...nodeNews
        ...nodeEvent
        ...nodeOffice
        ...nodePublication
        ...configPageFooter
        ...configPageSite
      }
    }
  }
  # Rendered around every node. Null if the config page doesn't exist yet.
  siteConfig {
    ...configPageSite
  }
  footerConfig {
    ...configPageFooter
  }
  # Three levels: the header shows the first, editorial pages list their
  # children. Here and not in a query of its own: the query's cache key is its
  # variables, and the path carries the language.
  mainMenu: menuByName(name: MAIN) {
    links {
      ...menuLink
      subtree {
        ...menuLink
        subtree {
          ...menuLink
        }
      }
    }
  }
}
