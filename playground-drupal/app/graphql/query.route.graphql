query route($path: String!) {
  route(path: $path) {
    __typename
    ... on EntityUrl {
      entity {
        __typename
        ...nodePage
        ...nodeNews
        ...nodeEvent
        ...nodeOffice
        ...configPageFooter
        ...configPageSite
      }
    }
  }
  # Rendered around every node. Null if the config page doesn't exist yet.
  siteConfig {
    ...configPageSite
  }
  footerConfig {
    ...configPageFooter
  }
}
