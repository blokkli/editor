# The next events that haven't ended, published in the page's language. $today
# is a UTC day, as field_date stores it.
query upcomingEvents($language: String!, $today: String!) {
  events: entityQuery(
    entityType: NODE
    limit: 3
    filter: {
      conditions: [
        { field: "type", value: ["event"] }
        { field: "status", value: ["1"], language: $language }
        {
          field: "field_date.end_value"
          value: [$today]
          operator: GREATER_THAN_OR_EQUAL
        }
      ]
    }
    sort: [{ field: "field_date.value", direction: ASC }]
  ) {
    items {
      ...nodeTeaser
    }
  }
}
