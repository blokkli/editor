# The blocks without nested blocks, and the link list, whose blocks are links.
# Structure blocks spread this instead of the `paragraph` union, which would be
# recursive.
fragment paragraphLeaf on Paragraph {
  ...paragraphTitle
  ...paragraphText
  ...paragraphImage
  ...paragraphVideo
  ...paragraphLink
  ...paragraphTable
  ...paragraphLinkList
  ...paragraphTeaser
  ...paragraphContact
  ...paragraphEmbed
  ...paragraphBanner
}
