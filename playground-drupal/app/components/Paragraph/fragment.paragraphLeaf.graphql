# The blocks without nested blocks, and the link list, the call to action and
# the steps, whose blocks are links or steps.
# Structure blocks spread this instead of the `paragraph` union, which would be
# recursive.
fragment paragraphLeaf on Paragraph {
  ...paragraphTitle
  ...paragraphText
  ...paragraphImage
  ...paragraphVideo
  ...paragraphLink
  ...paragraphTable
  ...paragraphLinkList
  ...paragraphTeaser
  ...paragraphContact
  ...paragraphEmbed
  ...paragraphBanner
  ...paragraphTeaserList
  ...paragraphCallToAction
  ...paragraphSteps
}
