fragment paragraphTeaser on ParagraphTeaser {
  node: fieldNode {
    __typename
    label
    url {
      path
    }
    ... on NodePage {
      lead: fieldLead
      hero: fieldHeroImage {
        ...mediaImage
      }
    }
    ... on NodeNews {
      lead: fieldLead
      hero: fieldHeroImage {
        ...mediaImage
      }
      created
    }
    ... on NodeEvent {
      lead: fieldLead
      hero: fieldHeroImage {
        ...mediaImage
      }
      date: fieldDate {
        start: startDate(format: "c")
        end: endDate(format: "c")
      }
    }
  }
}
