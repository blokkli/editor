fragment nodeTeaser on Node {
  __typename
  label
  url {
    path
  }
  ... on NodePage {
    lead: fieldLead
  }
  ... on NodeEditorial {
    lead: fieldLead
    hero: fieldHeroImage {
      ...mediaImage
    }
  }
  ... on NodeNews {
    lead: fieldLead
    hero: fieldHeroImage {
      ...mediaImage
    }
    createdDate: createdRawField {
      first {
        day: formatted(drupalDateFormat: DAY)
      }
    }
  }
  ... on NodePublication {
    lead: fieldLead
    publicationType: fieldPublicationType
    period: fieldPeriod {
      endDay: endDate(drupalDateFormat: DAY)
    }
  }
  ... on NodeEvent {
    lead: fieldLead
    hero: fieldHeroImage {
      ...mediaImage
    }
    date: fieldDate {
      ...dateRange
    }
  }
}
