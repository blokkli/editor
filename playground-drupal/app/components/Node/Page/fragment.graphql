fragment nodePage on NodePage {
  uuid
  title
  lead: fieldLead
  hero: fieldHeroImage {
    ...mediaImage
  }
  changedDate: changedRawField {
    first {
      day: formatted(drupalDateFormat: DAY)
    }
  }
  blokkliProps {
    ...blokkliProps
  }
  paragraphs: fieldParagraphs {
    ...paragraphsFieldItem
    props {
      ...paragraph
    }
  }
  aside: fieldAside {
    ...paragraphsFieldItem
    props {
      ...paragraph
    }
  }
}
