fragment nodeOffice on NodeOffice {
  uuid
  title
  lead: fieldLead
  location: fieldLocation {
    image: fieldImage {
      ...mediaImage
    }
  }
  ...officeDetails
  blokkliProps {
    ...blokkliProps
  }
  paragraphs: fieldParagraphs {
    ...paragraphsFieldItem
    props {
      ...paragraph
    }
  }
}
