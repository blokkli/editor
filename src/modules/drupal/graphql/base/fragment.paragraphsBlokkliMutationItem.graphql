fragment paragraphsBlokkliMutationItem on FieldItemTypeParagraphsBlokkliMutation {
  timestamp: created
  pluginId
  enabled
  plugin {
    label
    affectedItemUuid: affectedParagraphUuid
    importSummary {
      paragraphsImported
      referencesResolvedByUuid
      skippedBundles {
        bundle
        count
      }
      droppedFields {
        bundle
        fieldName
      }
      referencesResolvedByLabel {
        entityType
        label
        targetId
      }
      referencesUnresolved {
        entityType
        uuid
        label
        reason
      }
    }
  }
}
