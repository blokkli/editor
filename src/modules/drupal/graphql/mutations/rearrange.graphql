mutation pbRearrangeParagraphs(
  $entityType: EntityType!
  $entityUuid: String!
  $langcode: String
  $hostType: String!
  $hostUuid: String!
  $hostFieldName: String!
  $uuids: [String!]!
) {
  state: paragraphsEditMutationState(
    entityType: $entityType
    entityUuid: $entityUuid
  ) {
    action: rearrange(
      hostUuid: $hostUuid
      hostType: $hostType
      hostFieldName: $hostFieldName
      uuids: $uuids
    ) {
      ...paragraphsBlokkliMutationResult
    }
  }
}
