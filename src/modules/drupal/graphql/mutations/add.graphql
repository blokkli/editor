mutation pbAddParagraph(
  $entityType: EntityType!
  $entityUuid: String!
  $langcode: String
  $type: String!
  $hostType: String!
  $hostUuid: String!
  $hostFieldName: String!
  $afterUuid: String
) {
  state: paragraphsEditMutationState(
    entityType: $entityType
    entityUuid: $entityUuid
  ) {
    action: add(
      type: $type
      afterUuid: $afterUuid
      hostType: $hostType
      hostUuid: $hostUuid
      hostFieldName: $hostFieldName
    ) {
      ...paragraphsBlokkliMutationResult
    }
  }
}
