mutation pbCopyFromExisting(
  $entityType: EntityType!
  $entityUuid: String!
  $fields: [String]!
  $sourceUuid: String!
  $langcode: String
) {
  state: paragraphsEditMutationState(
    entityType: $entityType
    entityUuid: $entityUuid
  ) {
    action: copy_from_existing(fields: $fields, sourceUuid: $sourceUuid) {
      ...paragraphsBlokkliMutationResult
    }
  }
}
