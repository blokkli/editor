query pbEntitiesSearch {
  paragraphsBlokkliEntitiesSearch {
    items {
      id
      uuid
      entityType
      bundle
      label
      url
      context
    }
    bundleLabels {
      id
      label
    }
    entityTypeLabels {
      id
      label
    }
  }
}

query pbEditStatesSummary {
  paragraphsBlokkliEditStatesSummary {
    hostEntityType
    hostEntityUuid
    lastChanged
    uid
  }
}
