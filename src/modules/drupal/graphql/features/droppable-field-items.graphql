query pbDroppableFieldItems(
  $entityType: EntityType!
  $entityUuid: String!
  $langcode: String!
  $paragraphUuid: String
  $fieldName: String!
) {
  state: getParagraphsEditState(
    entityType: $entityType
    entityUuid: $entityUuid
    langcode: $langcode
  ) {
    droppableFieldItems(paragraphUuid: $paragraphUuid, fieldName: $fieldName) {
      id
      entityType
      bundle
      label
      thumbnailSrc
      targetBundles
    }
  }
}
