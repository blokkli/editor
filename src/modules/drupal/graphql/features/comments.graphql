mutation pbToggleCommentTaskItem(
  $entityType: EntityType!
  $entityUuid: String!
  $langcode: String!
  $uuid: String!
  $taskIndex: Int!
) {
  action: paragraphsBlokkliToggleCommentTaskItem(
    entityType: $entityType
    entityUuid: $entityUuid
    langcode: $langcode
    uuid: $uuid
    taskIndex: $taskIndex
