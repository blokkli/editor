mutation pbPublish(
  $entityType: EntityType!
  $entityUuid: String!
  $langcode: String
  $createNewState: Boolean
  $languages: [String!]
  $revisionLogMessage: String
) {
  state: paragraphsEditMutationState(
    entityType: $entityType
    entityUuid: $entityUuid
  ) {
    action: publish(
      createNewState: $createNewState
      languages: $languages
      revisionLogMessage: $revisionLogMessage
    ) {
      ...paragraphsBlokkliMutationResult
    }
  }
}

query pbPublishOptions(
  $entityType: EntityType!
  $entityUuid: String!
  $langcode: String!
) {
  state: getParagraphsEditState(
    entityType: $entityType
    entityUuid: $entityUuid
    langcode: $langcode
  ) {
    publishOptions {
      ...paragraphsBlokkliPublishOptions
    }
  }
}

query pbSearchEditStates($page: Int) {
  pbSearchEditStates(page: $page) {
    perPage
    total
    items {
      uuid
      hostEntityUuid
      hostEntityType
      label
      url(rel: "blokkli-editing") {
        path
      }
      currentUserIsOwner
      mutations: mutationsRawField {
        count
      }
      uid {
        name
      }
      lastChanged
      entity {
        label
        status
        bundleLabel
      }
    }
    filters {
      ...paragraphsBlokkliConfigInput
    }
  }
}
