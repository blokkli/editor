mutation pbPublish(
  $entityType: EntityType!
  $entityUuid: String!
  $langcode: String
  $createNewState: Boolean
) {
  state: paragraphsEditMutationState(
    entityType: $entityType
    entityUuid: $entityUuid
  ) {
    action: publish(createNewState: $createNewState) {
      ...paragraphsBlokkliMutationResult
    }
  }
}
