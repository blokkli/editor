mutation pbAddFragmentParagraph(
  $entityType: EntityType!
  $entityUuid: String!
  $langcode: String
  $name: String!
  $hostType: String!
  $hostUuid: String!
  $hostFieldName: String!
  $afterUuid: String
  $options: String
) {
  state: paragraphsEditMutationState(
    entityType: $entityType
    entityUuid: $entityUuid
  ) {
    action: add_fragment(
      name: $name
      afterUuid: $afterUuid
      hostType: $hostType
      hostUuid: $hostUuid
      hostFieldName: $hostFieldName
      options: $options
    ) {
      ...paragraphsBlokkliMutationResult
    }
  }
}
