query pbMediaLibraryGetResults(
  $page: Int
  $filters: [ParagraphsBlokkliUserConfigInput]
) {
  pbMediaLibraryGetResults(page: $page, filters: $filters) {
    items {
      label
      mediaId
      context
      thumbnail
      targetBundles
      mediaBundle
    }
    total
    perPage
    filters {
      ...paragraphsBlokkliConfigInput
    }
  }
}
