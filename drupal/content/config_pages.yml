- key: footer
  type: footer
  field_paragraphs:
    - type: text
      field_text:
        de: '<p>Blockingen / Bloquens, die zweisprachige Gemeinde am See.</p>'
    - type: contact
      options: { display: compact }
      field_office: { node: municipal-chancery }
    - type: link
      options: { style: secondary }
      field_link: { node: administration }
      field_title: { de: Alle Ämter und Öffnungszeiten }

- key: site
  type: site
  field_site_name: { de: Blockingen }
  # The meta navigation, in the header's service bar.
  field_service_links:
    - type: link
      field_link: https://www.example.com/online-counter
      field_title: { de: Online-Schalter }
    - type: link
      field_link: { node: municipal-chancery }
      field_title: { de: Kontakt }
  # The home page's frequently searched links: its own pages where there are
  # some, the rest are placeholders like the vacancies.
  field_quick_links:
    - type: link
      field_link: { node: collection-days }
      field_title: { de: Abfuhrtage }
    - type: link
      field_link: { node: tax-return }
      field_title: { de: Steuererklärung }
    - type: link
      field_link: { node: moving-in }
      field_title: { de: Zuzug }
    - type: link
      field_link: { node: documents }
      field_title: { de: Identitätskarte und Pass }
    - type: link
      field_link: { node: building-permits }
      field_title: { de: Baugesuch einreichen }
    - type: link
      field_link: { node: day-school }
      field_title: { de: Tagesschule }
    - type: link
      field_link: { node: sports-facilities }
      field_title: { de: Hallen mieten }
    - type: link
      field_link: https://www.example.com/jobs
      field_title: { de: Offene Stellen }
  # Banners at the very top of every page.
  field_notice:
    - type: banner
      options: { color: success }
      field_title:
        de: 'Das Strandbad öffnet am Samstag, nach der Sanierung mit einem neuen Kinderbereich.'
      field_link: { node: pool-opening }
