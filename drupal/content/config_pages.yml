- key: footer
  type: footer
  field_paragraphs:
    - type: text
      field_text:
        en: '<p>Blockingen / Bloquens, the town by the lake.</p>'
        de: '<p>Blockingen / Bloquens, die Gemeinde am See.</p>'
        fr: '<p>Blockingen / Bloquens, la commune au bord du lac.</p>'
    - type: contact
      options: { display: compact }
      field_office: { node: town-hall }
    - type: link
      options: { style: secondary }
      field_link: { node: town-hall }
      field_title: { en: Contact, de: Kontakt, fr: Contact }

- key: site
  type: site
  field_site_name: { en: Blockingen, de: Blockingen, fr: Bloquens }
  # The meta navigation, in the header's service bar.
  field_service_links:
    - type: link
      field_link: https://www.example.com/online-counter
      field_title: { en: Online counter, de: Online-Schalter, fr: Guichet en ligne }
    - type: link
      field_link: { node: town-hall }
      field_title: { en: Contact, de: Kontakt, fr: Contact }
  # The home page's frequently searched links: its own pages where there are
  # some, the rest are placeholders like the online counter.
  field_quick_links:
    - type: link
      field_link: https://www.example.com/online-counter
      field_title: { en: Online counter, de: Online-Schalter, fr: Guichet en ligne }
    - type: link
      field_link: https://www.example.com/waste
      field_title: { en: Waste and recycling, de: Abfall & Recycling, fr: Déchets et recyclage }
    - type: link
      field_link: https://www.example.com/taxes
      field_title: { en: Taxes, de: Steuern, fr: Impôts }
    - type: link
      field_link: { node: building-permits }
      field_title: { en: Building permits, de: Baubewilligungen, fr: Permis de construire }
    - type: link
      field_link: { node: living-here }
      field_title: { en: Moving here, de: Zuzug, fr: S'installer ici }
    - type: link
      field_link: https://www.example.com/schools
      field_title: { en: Schools and childcare, de: Schule & Betreuung, fr: École et accueil }
    - type: link
      field_link: https://www.example.com/rooms
      field_title: { en: Room hire, de: Raumvermietung, fr: Location de salles }
    - type: link
      field_link: https://www.example.com/jobs
      field_title: { en: Vacancies, de: Offene Stellen, fr: Postes vacants }
  # Banners at the very top of every page.
  field_notice:
    - type: banner
      options: { color: warning }
      field_title:
        en: The lakeside pool opens on Saturday. It's closed on Mondays for maintenance.
        de: Das Strandbad öffnet am Samstag. Montags ist es wegen Unterhaltsarbeiten geschlossen.
        fr: La piscine du lac ouvre samedi. Elle est fermée le lundi pour l'entretien.
      field_link: { node: pool-opening }
