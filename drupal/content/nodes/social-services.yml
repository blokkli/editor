field_paragraphs:
  - type: text
    field_text:
      de: '<p>Die Sozialen Dienste beraten und unterstützen Menschen in Blockingen, die in eine schwierige Lage geraten sind: bei Geldsorgen und Schulden, bei der Suche nach einer Stelle oder einer Wohnung, in Familienfragen. Sie prüfen Gesuche um Sozialhilfe und begleiten die Menschen, die sie beziehen. Die Anlaufstelle Alter berät ältere Menschen und ihre Angehörigen.</p><p>Alle Mitarbeitenden unterstehen der Schweigepflicht. Vereinbaren Sie einen Termin am Telefon; in einer Notlage erhalten Sie noch am selben Tag einen. Im selben Haus, im Verwaltungszentrum, ist die AHV-Zweigstelle.</p>'
