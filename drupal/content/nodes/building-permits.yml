key: building-permits
type: page
title: { de: Baugesuch einreichen }
field_lead:
  de: Wie Sie ein Baugesuch einreichen und wie es danach weitergeht.
field_office: { node: building-planning }
field_paragraphs:
  - type: text
    field_text:
      de: '<p>Die meisten Bauten, Anbauten und Umbauten brauchen eine Baubewilligung. Reichen Sie das Gesuch vor Baubeginn ein: Arbeiten ohne Bewilligung können gestoppt werden. Ein vollständiges Gesuch ohne Einsprachen entscheiden wir in der Regel innert zwei Monaten.</p>'
  # The text's box option: an info box.
  - type: text
    options: { box: info }
    field_text:
      de: '<p><strong>Elektronisch einreichen:</strong> Baugesuche können Sie auch über den <a href="https://www.example.com/online-counter">Online-Schalter</a> einreichen. Pläne laden Sie als PDF hoch; Papier brauchen wir dann keines.</p>'
  - type: title
    field_title: { de: Was das Gesuch enthält }
  - type: text
    field_text:
      de: '<ul><li>das Gesuchsformular, unterschrieben von der Bauherrschaft, der Grundeigentümerin oder dem Grundeigentümer und der Person, die die Pläne gezeichnet hat</li><li>einen Situationsplan im Massstab 1:500 mit den Abständen zu den Nachbargrundstücken</li><li>Grundrisse, Schnitte und Fassaden im Massstab 1:100</li><li>einen Umgebungsplan mit Parkplätzen, Terrain und Bepflanzung</li><li>bei einer neuen Heizung oder einem Neubau den Energienachweis</li></ul>'
  - type: title
    field_title: { de: Gesuch einreichen }
  - type: text
    key: counter-text
    field_text:
      de: '<p>Geben Sie das Gesuch mit den Plänen in dreifacher Ausführung am Schalter von Bau und Planung im Verwaltungszentrum ab, oder senden Sie es per Post. Der Schalter ist am Vormittag von 8.00 bis 12.00 Uhr offen, am Nachmittag nach Vereinbarung. Wir prüfen am Schalter gern, ob das Gesuch vollständig ist.</p>'
  - type: title
    field_title: { de: Ablauf }
  - type: steps
    field_paragraphs:
      - type: step
        field_title: { de: Vorabklärung }
        field_text:
          de: '<p>Besprechen Sie Ihr Vorhaben früh mit Bau und Planung, am besten mit einer Skizze. Das spart Zeit und Überarbeitungen. Die erste Beratung ist gratis.</p>'
      - type: step
        field_title: { de: Gesuch einreichen }
        field_text:
          de: '<p>Reichen Sie das Formular und die Pläne vollständig und unterschrieben ein. Fehlt etwas, fordern wir es nach; die Frist beginnt erst mit dem vollständigen Gesuch.</p>'
      - type: step
        field_title: { de: Prüfung und Publikation }
        field_text:
          de: '<p>Bau und Planung prüft das Gesuch. Danach stellen Sie die Bauprofile auf, und wir publizieren das Gesuch im Amtsblatt und auf dieser Website.</p>'
      - type: step
        field_title: { de: Einsprachefrist }
        field_text:
          de: '<p>Während 30 Tagen liegt das Gesuch öffentlich auf. In dieser Zeit können Betroffene Einsprache erheben.</p>'
      - type: step
        field_title: { de: Bauentscheid }
        field_text:
          de: '<p>Der Gemeinderat entscheidet über das Gesuch und über allfällige Einsprachen. Nach Ablauf der Beschwerdefrist ist der Entscheid rechtskräftig, und Sie dürfen bauen.</p>'
  - type: image
    field_media: { media: building-profiles }
    field_caption: { de: Die Bauprofile zeigen das geplante Gebäude }
  - type: text
    options: { box: warning }
    field_text:
      de: '<p><strong>Wichtig:</strong> Beginnen Sie erst mit den Bauarbeiten, wenn die Bewilligung rechtskräftig ist. Andernfalls kann ein Baustopp verfügt werden.</p>'
  - type: title
    field_title: { de: Gebühren }
  - type: table
    options: { striped: true }
    field_table:
      de: '<table><thead><tr><th>Vorhaben</th><th>Gebühr</th></tr></thead><tbody><tr><td>Gartenhaus</td><td>Fr. 150.–</td></tr><tr><td>Anbau</td><td>Fr. 800.–</td></tr><tr><td>Neubau</td><td>Fr. 2500.–</td></tr></tbody></table>'
  - type: text
    field_text:
      de: '<p>Die Tabelle zeigt Richtwerte: Die Gebühr richtet sich nach den Baukosten und nach unserem Aufwand. Dazu kommen die Kosten für die Publikation und, bei einem Neubau, die Anschlussgebühren für Wasser und Abwasser.</p>'
  - type: title
    field_title: { de: Häufige Fragen }
  - type: accordion
    field_title: { de: 'Was passiert bei einer Einsprache?' }
    field_paragraphs:
      - type: text
        field_text:
          de: '<p>Wir laden Sie und die Einsprechenden zu einer Einigungsverhandlung ein. Oft genügt eine kleine Änderung am Projekt. Kommt keine Einigung zustande, entscheidet der Gemeinderat auch über die Einsprache. Gegen seinen Entscheid kann man beim Kanton Beschwerde führen.</p>'
  - type: accordion
    field_title: { de: 'Wie lange gilt die Bewilligung?' }
    field_paragraphs:
      - type: text
        field_text:
          de: '<p>Zwei Jahre, ab dem Tag, an dem sie rechtskräftig ist. Bis dahin müssen Sie mit dem Bau begonnen haben. Auf Gesuch verlängern wir sie einmal um ein Jahr.</p>'
  # Building applications are official publications. On a detail page, the
  # automatic list is always a list.
  - type: teaser_list
    options: { source: publications }
