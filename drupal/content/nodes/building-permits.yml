key: building-permits
type: page
title: { en: Building permits, de: Baubewilligungen, fr: Permis de construire }
field_lead:
  en: When you need a permit, and how to apply for one.
  de: Wann es eine Bewilligung braucht und wie Sie sie beantragen.
  fr: Quand il faut un permis, et comment le demander.
field_office: { node: town-hall }
field_paragraphs:
  - type: text
    field_text:
      en: '<p>Most buildings, extensions and conversions need a permit. Apply before you start: work without a permit can be stopped.</p>'
      de: '<p>Die meisten Bauten, Anbauten und Umbauten brauchen eine Bewilligung. Reichen Sie das Gesuch vor Baubeginn ein: Arbeiten ohne Bewilligung können gestoppt werden.</p>'
      fr: '<p>La plupart des constructions, agrandissements et transformations nécessitent un permis. Déposez la demande avant le début des travaux : des travaux sans permis peuvent être arrêtés.</p>'
  # The text's box option: an info box.
  - type: text
    options: { box: info }
    field_text:
      en: '<p><strong>Apply online:</strong> you can also submit building applications at the <a href="https://www.example.com/online-counter">online counter</a>. Upload the plans as PDFs.</p>'
      de: '<p><strong>Elektronisch einreichen:</strong> Baugesuche können Sie auch über den <a href="https://www.example.com/online-counter">Online-Schalter</a> einreichen. Pläne laden Sie als PDF hoch.</p>'
      fr: '<p><strong>Dépôt électronique :</strong> vous pouvez aussi déposer les demandes de permis au <a href="https://www.example.com/online-counter">guichet en ligne</a>. Téléchargez les plans au format PDF.</p>'
  - type: title
    field_title: { en: Applying, de: Gesuch einreichen, fr: Déposer une demande }
  - type: text
    key: counter-text
    field_text:
      en: '<p>Hand in the application form with the plans at the counter of the building office, or send it by post.</p>'
      de: '<p>Geben Sie das Gesuchsformular mit den Plänen am Schalter des Bauamts ab, oder senden Sie es per Post.</p>'
      fr: '<p>Remettez le formulaire de demande avec les plans au guichet du service des constructions, ou envoyez-le par la poste.</p>'
  - type: title
    field_title: { en: Procedure, de: Ablauf, fr: Procédure }
  - type: steps
    field_paragraphs:
      - type: step
        field_title: { en: Preliminary enquiry, de: Vorabklärung, fr: Clarification préalable }
        field_text:
          en: '<p>Discuss your project with the building office early on. It saves time and revisions.</p>'
          de: '<p>Besprechen Sie Ihr Vorhaben frühzeitig mit der Bauverwaltung. Das spart Zeit und Überarbeitungen.</p>'
          fr: '<p>Discutez de votre projet suffisamment tôt avec le service des constructions. Cela évite des pertes de temps et des remaniements.</p>'
      - type: step
        field_title: { en: Submitting the application, de: Gesuch einreichen, fr: Dépôt de la demande }
        field_text:
          en: '<p>Hand in the form, the site plan and the building plans, complete and signed.</p>'
          de: '<p>Formular, Situationsplan und Baupläne vollständig und unterzeichnet einreichen.</p>'
          fr: '<p>Remettez le formulaire, le plan de situation et les plans de construction, complets et signés.</p>'
      - type: step
        field_title: { en: Review and publication, de: Prüfung und Publikation, fr: Examen et publication }
        field_text:
          en: '<p>The building office reviews the application. Then the building outline is marked on site and the application goes on public display.</p>'
          de: '<p>Die Bauverwaltung prüft das Gesuch. Anschliessend werden Profile gestellt und das Gesuch öffentlich aufgelegt.</p>'
          fr: '<p>Le service des constructions examine la demande. Ensuite, les gabarits sont posés et la demande est mise à l''enquête publique.</p>'
      - type: step
        field_title: { en: Objection period, de: Einsprachefrist, fr: Délai d'opposition }
        field_text:
          en: '<p>While the application is on display, anyone affected can object. The period is 30 days.</p>'
          de: '<p>Während der Auflage können Betroffene Einsprache erheben. Die Frist beträgt 30 Tage.</p>'
          fr: '<p>Pendant la mise à l''enquête, les personnes concernées peuvent faire opposition. Le délai est de 30 jours.</p>'
      - type: step
        field_title: { en: Decision, de: Bauentscheid, fr: Décision }
        field_text:
          en: '<p>The town council decides on the application. Once the decision is final, you may start building.</p>'
          de: '<p>Der Gemeinderat entscheidet über das Gesuch. Nach Rechtskraft dürfen Sie mit dem Bau beginnen.</p>'
          fr: '<p>Le conseil communal statue sur la demande. Une fois la décision entrée en force, vous pouvez commencer les travaux.</p>'
  - type: text
    options: { box: warning }
    field_text:
      en: '<p><strong>Important:</strong> only start building once the permit is final. Otherwise, the work can be stopped.</p>'
      de: '<p><strong>Wichtig:</strong> Beginnen Sie erst mit den Bauarbeiten, wenn die Bewilligung rechtskräftig ist. Andernfalls kann ein Baustopp verfügt werden.</p>'
      fr: '<p><strong>Important :</strong> ne commencez les travaux qu''une fois le permis entré en force. Sinon, un arrêt des travaux peut être ordonné.</p>'
  - type: table
    options: { striped: true }
    field_table:
      en: '<table><thead><tr><th>Project</th><th>Fee</th></tr></thead><tbody><tr><td>Garden shed</td><td>CHF 150</td></tr><tr><td>Extension</td><td>CHF 800</td></tr><tr><td>New house</td><td>CHF 2,500</td></tr></tbody></table>'
      de: '<table><thead><tr><th>Vorhaben</th><th>Gebühr</th></tr></thead><tbody><tr><td>Gartenhaus</td><td>CHF 150</td></tr><tr><td>Anbau</td><td>CHF 800</td></tr><tr><td>Neubau</td><td>CHF 2500</td></tr></tbody></table>'
      fr: '<table><thead><tr><th>Projet</th><th>Émolument</th></tr></thead><tbody><tr><td>Cabanon de jardin</td><td>CHF 150</td></tr><tr><td>Agrandissement</td><td>CHF 800</td></tr><tr><td>Maison neuve</td><td>CHF 2500</td></tr></tbody></table>'
  - type: title
    field_title:
      en: Frequently asked questions
      de: Häufige Fragen
      fr: Questions fréquentes
  - type: accordion
    field_title:
      en: Do I need a permit for a garden shed?
      de: Braucht ein Gartenhaus eine Bewilligung?
      fr: Un cabanon de jardin nécessite-t-il un permis ?
    field_paragraphs:
      - type: text
        field_text:
          en: '<p>Yes, from a floor area of 10 m². Smaller sheds only need to be reported.</p>'
          de: '<p>Ja, ab einer Grundfläche von 10 m². Kleinere Gartenhäuser müssen nur gemeldet werden.</p>'
          fr: '<p>Oui, dès une surface de 10 m². Les cabanons plus petits doivent seulement être annoncés.</p>'
      - type: columns
        options: { ratio: 66-33 }
        field_left:
          - type: text
            field_text:
              en: '<p>Mark the shed on the site plan, with its distance to the neighbouring plots.</p>'
              de: '<p>Zeichnen Sie das Gartenhaus im Situationsplan ein, mit dem Abstand zu den Nachbargrundstücken.</p>'
              fr: '<p>Indiquez le cabanon sur le plan de situation, avec sa distance aux parcelles voisines.</p>'
        field_right:
          - type: image
            field_media: { media: meadow }
            field_caption: { en: A garden by the lake, de: Ein Garten am See, fr: Un jardin au bord du lac }
  - type: gallery
    options: { display: slider, width: wide }
    field_paragraphs:
      - type: image
        field_media: { media: lake }
        field_caption: { en: The lakeshore, de: Das Seeufer, fr: La rive du lac }
      - type: image
        field_media: { media: stone }
        field_caption: { en: The old town, de: Die Altstadt, fr: La vieille ville }
  - type: image
    options: { width: full }
    field_media: { media: stone }
  - type: video
    field_video: { media: big-buck-bunny }
  - type: from_library
    field_reusable_paragraph: { library: counter-hours }
  - type: link
    options: { style: primary }
    field_link: { node: town-hall }
    field_title:
      en: Contact the building office
      de: Bauamt kontaktieren
      fr: Contacter le service des constructions
