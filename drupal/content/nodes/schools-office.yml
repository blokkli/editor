field_paragraphs:
  - type: text
    field_text:
      de: '<p>Die Schulverwaltung ist für den Kindergarten und die Primarschule da, in beiden Abteilungen. Sie meldet die Kinder für den Kindergarten an, teilt sie in die Klassen ein, organisiert den Schulbus und die Tagesschule und berechnet deren Tarife. Sie ist die Anlaufstelle für die Eltern und leitet Ihre Fragen an die richtige Stelle weiter.</p><p>Fragen zum Unterricht Ihres Kindes besprechen Sie am besten zuerst mit der Lehrperson, danach mit der Schulleitung der deutsch- oder der französischsprachigen Abteilung. Das Büro der Schulverwaltung ist im Schulhaus Seefeld, am Vormittag und am Dienstag- und am Donnerstagnachmittag offen.</p>'
