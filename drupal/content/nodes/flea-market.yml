field_paragraphs:
  - type: text
    field_text:
      de: '<p>Solange der Dorfplatz umgestaltet wird, findet der Flohmarkt auf dem Schulhausareal statt. Stöbern Sie an rund 80 Ständen, von Kinderkleidern über Schallplatten bis zu alten Möbeln. Der Elternrat verkauft Suppe, Kaffee und Kuchen.</p><p>Einen Stand anmelden können alle, die Gebrauchtes verkaufen, aber keine Händlerinnen und Händler. Ein Platz von drei Metern kostet Fr. 15.–; Kinder, die ihre Spielsachen verkaufen, erhalten ihn gratis. Melden Sie sich bis zwei Wochen vorher online an. Kommen Sie zu Fuss oder mit dem Velo: Die Parkplätze beim Schulhaus sind für die Stände reserviert.</p>'
