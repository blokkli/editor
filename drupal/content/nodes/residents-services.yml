field_paragraphs:
  - type: text
    field_text:
      de: '<p>Die Einwohnerdienste führen das Einwohnerregister von Blockingen. Bei uns melden Sie sich an, wenn Sie zuziehen, und ab, wenn Sie wegziehen. Hier melden Sie auch einen Umzug innerhalb der Gemeinde, Ihren Hund und Ihre Korrespondenzsprache. Wir stellen Identitätskarten aus, bestellen Bestätigungen aus dem Register und geben die Anwohnerparkkarten ab.</p><p>Einen Termin brauchen Sie nicht, und am Donnerstag ist der Schalter bis 18.30 Uhr offen. Bringen Sie für alle Anliegen einen Ausweis mit. Vieles erledigen Sie auch am <a href="https://www.example.com/online-counter">Online-Schalter</a>, etwa einen Umzug oder eine Wohnsitzbestätigung.</p>'
