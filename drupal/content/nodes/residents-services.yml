field_paragraphs:
  - type: text
    field_text:
      en: '<p>The residents'' services keep Blockingen''s residents'' register. You register with us when you move here and deregister when you move away. This is also where you report a move within the town, your dog and your language of correspondence. We issue identity cards, provide certificates from the register and hand out resident parking permits.</p><p>You don''t need an appointment, and on Thursdays the counter is open until 18:30. Please bring an identity document, whatever your request. You can also do many things at the <a href="https://www.example.com/online-counter">online counter</a>, such as reporting a move or ordering a certificate of residence.</p>'
      de: '<p>Die Einwohnerdienste führen das Einwohnerregister von Blockingen. Bei uns melden Sie sich an, wenn Sie zuziehen, und ab, wenn Sie wegziehen. Hier melden Sie auch einen Umzug innerhalb der Gemeinde, Ihren Hund und Ihre Korrespondenzsprache. Wir stellen Identitätskarten aus, bestellen Bestätigungen aus dem Register und geben die Anwohnerparkkarten ab.</p><p>Einen Termin brauchen Sie nicht, und am Donnerstag ist der Schalter bis 18.30 Uhr offen. Bringen Sie für alle Anliegen einen Ausweis mit. Vieles erledigen Sie auch am <a href="https://www.example.com/online-counter">Online-Schalter</a>, etwa einen Umzug oder eine Wohnsitzbestätigung.</p>'
      fr: '<p>Le Contrôle des habitants tient le registre des habitants de Bloquens. C''est chez nous que vous annoncez votre arrivée quand vous vous installez dans la commune, et votre départ quand vous la quittez. Vous y annoncez aussi un déménagement au sein de la commune, votre chien et votre langue de correspondance. Nous établissons les cartes d''identité, délivrons les attestations du registre et remettons les vignettes de stationnement pour résidents.</p><p>Vous n''avez pas besoin de rendez-vous, et le jeudi, le guichet est ouvert jusqu''à 18 h 30. Munissez-vous d''une pièce d''identité, quelle que soit votre démarche. Beaucoup de choses peuvent aussi se régler au <a href="https://www.example.com/online-counter">guichet en ligne</a>, par exemple un déménagement ou une attestation de domicile.</p>'
