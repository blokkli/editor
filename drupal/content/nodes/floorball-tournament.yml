title: { de: Seefeld-Cup im Unihockey }
field_lead:
  de: 'Rund 40 Teams, von den Jüngsten bis zu den Plauschteams, spielen einen Tag lang um den Seefeld-Cup.'
field_date: { value: '+13 days 09:00', end_value: '+13 days 17:30' }
