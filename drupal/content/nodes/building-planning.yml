field_paragraphs:
  - type: text
    field_text:
      de: '<p>Bau und Planung prüft Baugesuche und Meldungen, berät Bauherrschaften und führt den Zonenplan. Wir betreuen auch die Bauprojekte der Gemeinde, zurzeit vor allem den neuen Dorfplatz.</p><p>Am Vormittag ist der Schalter im Verwaltungszentrum offen, ohne Anmeldung. Am Nachmittag nehmen wir uns Zeit für Beratungen: Vereinbaren Sie dafür einen Termin, am besten mit einer Skizze Ihres Vorhabens. Die erste Beratung ist gratis. Baugesuche reichen Sie am Schalter, per Post oder am <a href="https://www.example.com/online-counter">Online-Schalter</a> ein. Die Gesuche, die öffentlich aufliegen, finden Sie unter den amtlichen Publikationen.</p>'
