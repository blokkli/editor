key: building-planning
type: office
title: { en: 'Building and planning', de: 'Bau und Planung', fr: 'Constructions et urbanisme' }
field_lead:
  en: 'Building permits, notifications and the zoning plan, and the town''s building projects. Afternoons by appointment.'
  de: 'Baubewilligungen, Meldungen und der Zonenplan, und die Bauprojekte der Gemeinde. Nachmittags nach Vereinbarung.'
  fr: 'Permis de construire, annonces et plan de zones, ainsi que les projets de construction de la commune. L''après-midi sur rendez-vous.'
field_location: { term: administrative-centre }
field_phone: '+41 32 555 01 30'
field_email: bau@blockingen.example
# Mornings only: the afternoons are for appointments. Day 0 is Sunday.
field_opening_hours:
  - { day: 1, starthours: 800, endhours: 1200 }
  - { day: 2, starthours: 800, endhours: 1200 }
  - { day: 3, starthours: 800, endhours: 1200 }
