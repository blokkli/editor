key: road-closure
type: publication
title:
  en: Temporary closure of Dorfstrasse
  de: Temporäre Sperrung der Dorfstrasse
  fr: Fermeture temporaire de la Dorfstrasse
field_lead:
  en: Dorfstrasse is closed to traffic between the church and the school while the village square is redesigned.
  de: Die Dorfstrasse ist zwischen Kirche und Schulhaus für den Verkehr gesperrt, solange der Dorfplatz umgestaltet wird.
  fr: La Dorfstrasse est fermée à la circulation entre l'église et l'école pendant le réaménagement de la place du village.
field_publication_type: traffic
field_period: { value: '-2 days', end_value: '+8 days' }
field_paragraphs:
  - type: text
    field_text:
      en: '<p>A diversion is signposted via Rebweg. The bus stop "Dorfplatz" moves to the school.</p>'
      de: '<p>Eine Umleitung über den Rebweg ist signalisiert. Die Bushaltestelle «Dorfplatz» wird zum Schulhaus verlegt.</p>'
      fr: '<p>Une déviation est signalée par le Rebweg. L''arrêt de bus « Dorfplatz » est déplacé vers l''école.</p>'
