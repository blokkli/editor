field_paragraphs:
  - type: text
    field_text:
      en: '<p>Blockingen and Bloquens are one town with two names: German and French are spoken here, and the lake belongs to everyone.</p>'
      de: '<p>Blockingen und Bloquens sind eine Gemeinde mit zwei Namen: Hier spricht man Deutsch und Französisch, und der See gehört allen.</p>'
      fr: '<p>Blockingen et Bloquens sont une seule commune avec deux noms : on y parle allemand et français, et le lac appartient à tout le monde.</p>'
