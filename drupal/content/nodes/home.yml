  en: Welcome to Blockingen
  de: Willkommen in Blockingen
  fr: Bienvenue à Bloquens
field_lead:
  en: The town by the lake, in two languages.
  de: Die Gemeinde am See, in zwei Sprachen.
  fr: La commune au bord du lac, en deux langues.
