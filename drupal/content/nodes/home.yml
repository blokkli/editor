# The front page: system.site.page.front is /node/1. The frontend renders it
# with its own header (with the search), then these blocks. Only here can
# blocks be the fragments "today" and "quick_links" (the site config page's
# frequently searched links).
key: home
id: 1
type: editorial
title:
  en: How can we help?
  de: Wie können wir Ihnen helfen?
  fr: Comment pouvons-nous vous aider ?
field_lead:
  en: Services, information and news from the town of Blockingen, in one place.
  de: Dienstleistungen, Auskünfte und Neuigkeiten der Gemeinde Blockingen – an einem Ort.
  fr: Prestations, renseignements et nouvelles de la commune de Bloquens, en un seul lieu.
field_hero_image: { media: town-from-lake }
field_host_options:
  - { key: header, value: image }
field_paragraphs:
  - type: blokkli_fragment
    field_blokkli_fragment_name: today
  - type: blokkli_fragment
    field_blokkli_fragment_name: quick_links
  - type: teaser_list
    options: { source: news }
  - type: call_to_action
    field_tagline: { en: Politics, de: Politik, fr: Politique }
    field_title:
      en: Municipal assembly on 2 December
      de: Gemeindeversammlung vom 2. Dezember
      fr: Assemblée communale du 2 décembre
    field_lead:
      en: Voters decide on the 2027 budget and the loan for renovating the school gym.
      de: Die Stimmberechtigten entscheiden über das Budget 2027 und den Kredit für die Sanierung der Schulhausturnhalle.
      fr: Les électrices et électeurs se prononcent sur le budget 2027 et le crédit pour la rénovation de la salle de gym de l'école.
    field_links:
      - type: link
        field_link: { node: politics }
        field_title: { en: Agenda and documents, de: Traktanden und Unterlagen, fr: Ordre du jour et documents }
  - type: columns
    options: { ratio: '50-50' }
    field_left:
      - type: teaser_list
        options: { source: events }
    field_right:
      - type: teaser_list
        options: { source: publications }
