field_paragraphs:
  - type: text
    field_text:
      de: '<p>Finanzen und Steuern verschickt die Steuererklärungen, stellt die Rechnungen für die Gemeinde- und Staatssteuern aus und vereinbart mit Ihnen einen Zahlungsplan, wenn Sie nicht alles auf einmal bezahlen können. Bei Fragen zum Ausfüllen helfen wir Ihnen gern, im März auch an zwei Abenden im Rathaus. Fragen zu Ihrer Veranlagung beantwortet die kantonale Steuerverwaltung. Die Steuererklärung reichen Sie am einfachsten online ein, mit der Steuersoftware des Kantons.</p><p>Für die Gemeinde führen wir die Buchhaltung und erarbeiten mit dem Gemeinderat das Budget, die Rechnung und den Finanzplan. Am Freitagnachmittag ist der Schalter geschlossen.</p>'
