title: { en: Politics, de: Politik, fr: Politique }
field_lead:
  en: The town council, votes and elections.
  de: Der Gemeinderat, Abstimmungen und Wahlen.
  fr: Le conseil communal, les votations et les élections.
field_host_options:
  - { key: header, value: plain }
field_paragraphs:
  - type: text
    field_text:
      en: '<p>The town council meets once a month. Its meetings are open to the public.</p>'
      de: '<p>Der Gemeinderat tagt einmal im Monat. Seine Sitzungen sind öffentlich.</p>'
      fr: '<p>Le conseil communal se réunit une fois par mois. Ses séances sont publiques.</p>'
