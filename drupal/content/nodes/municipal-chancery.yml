field_paragraphs:
  - type: text
    field_text:
      de: '<p>Die Gemeindekanzlei ist die erste Anlaufstelle im Rathaus. Sie beantwortet allgemeine Fragen und sagt Ihnen, welches Amt für Ihr Anliegen zuständig ist. Unter der Leitung von Gemeindeschreiberin Claire Rossel führt sie das Sekretariat des Gemeinderats, bereitet die Gemeindeversammlung vor, organisiert die Abstimmungen und Wahlen und veröffentlicht die amtlichen Publikationen.</p><p>Am Schalter erhalten Sie das Budget und die Rechnung gedruckt, und hier ist auch das Fundbüro der Gemeinde. Was Sie verloren haben, melden Sie am Telefon oder per E-Mail; Fundsachen bewahren wir ein Jahr lang auf.</p>'
