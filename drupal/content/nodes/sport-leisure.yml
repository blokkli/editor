field_paragraphs:
  - type: text
    field_text:
      de: '<p>Sport und Freizeit betreibt das Strandbad und vermietet die Turnhallen, den Sitzungsraum und die Rasenfelder. Wir unterstützen die rund 60 Vereine in Blockingen, prüfen ihre Gesuche um Beiträge und bewilligen Feste, Turniere und Märkte auf öffentlichem Grund. Für Ihren Anlass leihen wir Ihnen auch Mehrwegbecher.</p><p>Unser Büro ist beim Strandbad, am Montag, am Mittwoch und am Freitag offen. Das Strandbad selbst hat seine eigenen Öffnungszeiten, und Fundsachen aus dem Bad erhalten Sie an seiner Kasse zurück. Hallen reservieren Sie am einfachsten online, spätestens eine Woche vorher.</p>'
